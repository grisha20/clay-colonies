<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Clayfolk — персонажи и движения</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#232a20;color:#f4e4bd;font:16px system-ui}main{max-width:1080px;margin:36px auto;padding:0 24px}h1{font-size:28px;margin-bottom:8px}p{color:#c6c6ad;line-height:1.5}nav{display:flex;gap:12px;align-items:center;margin:22px 0}button,select{font:inherit;border:1px solid #797c57;background:#353e2c;color:#f4e4bd;border-radius:8px;padding:8px 14px}canvas{width:100%;height:auto;border-radius:16px}a{color:#d9b56f}#status{min-width:230px;font-size:14px}.hint{font-size:14px}
  </style>
</head>
<body><main>
  <h1>Мастерская движений Clayfolk</h1>
  <p>Жители, грузы, рыбы и хищники — в том же рендере, что и в игре.</p>
  <nav><label>Набор <select id="group"><option value="roles">Жители и роли</option><option value="royals">Правители: четыре ракурса</option><option value="cargo">Все грузы</option><option value="creatures">Существа и пленники</option><option value="fish">Четыре вида рыб</option><option value="combat">Бой с пауком</option><option value="food">Куст, мясо и туша паука</option><option value="buildings">Глиняные здания</option><option value="lake">Озеро: плавание и кувшинка</option><option value="shore">Монстр: вода и берег</option><option value="fence-stress">Ограда: направления и стыки</option><option value="fences">Забор и ворота</option><option value="fence-build">Ворота и полупрозрачная ограда</option><option value="placement">Предпросмотр постройки</option><option value="steps">Следы и опора</option><option value="camp">Костёр, свет и глубина</option><option value="drying">Сушка у костра (расстановка)</option><option value="crowd100">Толпа: 100</option><option value="crowd500">Толпа: 500</option></select></label><button id="pause">Пауза</button><label>Скорость <select id="speed"><option value="0.25">¼× · медленный шаг</option><option value="1" selected>1×</option><option value="5">5×</option><option value="50">50×</option></select></label><label>Ракурс <select id="direction"><option value="auto">Автоповорот</option><option value="front">Вперёд</option><option value="right">Вправо</option><option value="back">Назад</option><option value="left">Влево</option></select></label></nav><p id="status">Загрузка…</p>
  <label>Освещение <select id="light" disabled><option value="day">День</option><option value="morning">Утро</option><option value="evening">Вечер</option><option value="night">Ночь у костра</option><option value="off">Ночь, костёр погас</option></select></label>
  <label><input id="footprints" type="checkbox" checked> Следы ног</label>
  <div id="preview"></div>
  <p class="hint">Пауза замораживает движение; ракурс можно выбирать отдельно. На ускорении шаг остаётся читаемым. Страница работает без сервера и не меняет сохранения. <a href="/">Вернуться в игру</a></p>
</main><script type="module" src="/src/motionPreview.ts"></script></body>
</html>
